replicaCount: 2

image:
  repository: gitlab.example.com/root/devops-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Явно отключаем компоненты, шаблоны которых мы удалили
autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: ""

ingress:
  enabled: false

networkPolicy:
  enabled: false

# Переменные окружения для подов (Пункт 5.1.5)
env:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: devops-api-db-secret
        key: database-url

service:
  type: ClusterIP
  port: 8000

# Ресурсы (Пункт 5.1.3)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Security Context (Пункт 5.1.4 и 3.2)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true

# Распределение подов по разным нодам (Пункт 5.1.6)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: devops-api

# Probes (Пункт 5.1.2)
livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

# HPA настройки (Пункт 5.3)
autoscaling:
  enabled: true
  maxReplicas: 5
