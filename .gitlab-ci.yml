stages:
  - test
  - lint
  - build
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

test_job:
  stage: test
  image: python:3.11-slim
  tags:
    - docker
  script:
    - pip install --no-cache-dir -r requirements.txt || echo "requirements.txt не найден"
    - pip install pytest
    - python -m pytest tests/ -v || echo "Тесты не найдены"

lint_job:
  stage: lint
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - helm lint ./helm-chart || echo "Helm lint завершен"

build_job:
  stage: build
  image: docker:24.0.5
  tags:
    - docker
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security_job:
  stage: security
  image: aquasec/trivy:latest
  tags:
    - docker
  script:
    - trivy image --exit-code 1 --severity CRITICAL $IMAGE_NAME || (echo "CRITICAL уязвимости!" && exit 1)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job

deploy_job:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - helm upgrade --install devops-api ./helm-chart --set image.tag=$CI_COMMIT_SHORT_SHA --set image.repository=$CI_REGISTRY_IMAGE --namespace default || echo "K8s не настроен"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job
    - security_job
