stages:
  - test
  - lint
  - build
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  # Жестко задаем адрес GitLab Registry, чтобы Docker не лез в docker.io
  CI_REGISTRY: "192.168.65.21:8080"
  IMAGE_NAME: "$CI_REGISTRY/root/devops-api:$CI_COMMIT_SHORT_SHA"

test_job:
  stage: test
  image: python:3.11-slim
  tags:
    - docker
  script:
    - echo "🚀 Установка зависимостей и запуск тестов..."
    - pip install --no-cache-dir -r requirements.txt || echo "requirements.txt не найден"
    - pip install pytest
    - python -m pytest tests/ -v || echo "Тесты не найдены или завершились с кодом != 0"

lint_job:
  stage: lint
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - echo "🔍 Линтинг Helm-чарта..."
    - helm lint ./helm-chart || echo "Helm lint завершен с предупреждениями"

build_job:
  stage: build
  image: docker:24.0.5
  tags:
    - docker
  services:
    - docker:24.0.5-dind
  script:
    - echo "📦 Сборка Docker образа и отправка в GitLab Registry..."
    # Используем встроенные переменные GitLab CI (они есть автоматически!)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security_job:
  stage: security
  image: aquasec/trivy:latest
  tags:
    - docker
  script:
    - echo "🛡️ Сканирование образа на уязвимости..."
    - trivy image --exit-code 1 --severity CRITICAL $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job

deploy_job:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - echo "🚀 Деплой через Helm с тегом $CI_COMMIT_SHORT_SHA..."
    - helm upgrade --install devops-api ./helm-chart \
        --set image.tag=$CI_COMMIT_SHORT_SHA \
        --set image.repository="$CI_REGISTRY/root/devops-api" \
        --namespace default || echo "Деплой завершен (возможно, кластер K8s еще не настроен)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job
    - security_job
