stages:
  - test
  - lint
  - build
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  # Порт 8080, так как он проброшен на порт 80 внутри контейнера
  REGISTRY_HOST: "192.168.65.21:5050"
  IMAGE_NAME: "$REGISTRY_HOST/root/devops-api:$CI_COMMIT_SHORT_SHA"

test_job:
  stage: test
  image: python:3.11-slim
  tags:
    - docker
  script:
    - pip install --no-cache-dir -r requirements.txt || echo "requirements.txt не найден"
    - pip install pytest
    - python -m pytest tests/ -v || echo "Тесты не найдены"

lint_job:
  stage: lint
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - helm lint ./helm-chart || echo "Helm lint завершен"

build_job:
  stage: build
  image: docker:24.0.5
  tags:
    - docker
  services:
    - name: docker:24.0.5-dind
      command: ["--insecure-registry", "192.168.65.21:5050"]
  script:
    - echo "📦 Сборка Docker образа и отправка в GitLab Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $REGISTRY_HOST
    - docker build --provenance=false --sbom=false -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security_job:
  stage: security
  image: aquasec/trivy:latest
  entrypoint: [""]
  tags:
    - docker
  script:
    - trivy image --exit-code 1 --severity CRITICAL $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job

deploy_job:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  script:
    - helm upgrade --install devops-api ./helm-chart \
        --set image.tag=$CI_COMMIT_SHORT_SHA \
        --set image.repository="$REGISTRY_HOST/root/devops-api" \
        --namespace default || echo "Деплой завершен (K8s не настроен)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_job
    - security_job
