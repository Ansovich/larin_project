replicaCount: 2
image:
  repository: 192.168.65.21:5050/root/devops-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    haproxy.org/timeout-connect: "5s"
    haproxy.org/timeout-server: "30s"
  hosts:
    - host: devops-api.local
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

postgresql:
  enabled: true
  auth:
    username: devops_user
    password: "SuperSecretPassword123!"
    database: devops_db
  primary:
    service:
      type: ClusterIP # Доступ только изнутри Kubernetes (П. 5.5)
    persistence:
      enabled: true
      size: 1Gi
