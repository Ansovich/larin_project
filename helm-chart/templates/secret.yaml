apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-api.fullname" . }}-db-secret
type: Opaque
stringData:
  database-url: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "devops-api.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
